apiVersion: v1
kind: Pod
metadata:
  name: pod-1
  namespace: dev
spec:
  containers:
    - name: cont-1
      image: nginx
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "100m"
          memory: "5Mi"
        limits:
          cpu: "200m"
          memory: "10Mi"
