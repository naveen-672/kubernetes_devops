apiVersion: v1
kind: Pod
metadata:
  name: pod-12
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: instance
                operator: In
                values:
                  - logs
  containers:
    - name: cont-1
      image: nginx
      ports:
        - containerPort: 80
