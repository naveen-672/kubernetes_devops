apiVersion: v1
kind: Pod
metadata:
  name: pod-5
  labels:
    layer: app
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: layer
                operator: In
                values:
                  - db
          topologyKey: kubernetes.io/hostname
  containers:
    - name: cont-1
      image: nginx
      ports:
        - containerPort: 80
