apiVersion: v1
kind: Pod
metadata:
  name: pod-1
spec:
  containers:
    - name: cont-1
      image: nginx
      ports:
        - containerPort: 80
      resources:
        limits:
          cpu: "200m"
          memory: "100Mi"
        requests:
          cpu: "100m"
          memory: "50Mi"
      command:
        - /bin/bash
        - -c
        - touch /etc/docker; sleep 1000

      livenessProbe:
        exec:
          command:
            - cat
            - /etc/docker
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 30
